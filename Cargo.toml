[package]
name = "easyadb"
description = "Pair Android devices for wireless ADB by scanning a QR code in your terminal"
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.88"
authors = ["M. Samil Atesoglu <m.samilatesoglu@gmail.com>"]
repository = "https://github.com/shamilatesoglu/easyadb"
readme = "README.md"
keywords = ["adb", "android", "wireless", "qr", "tui"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github", ".gitignore"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
ratatui = "0.29"
rpassword = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }

[dev-dependencies]
tempfile = "3"
